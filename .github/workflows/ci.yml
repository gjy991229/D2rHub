name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test
        shell: cmd

      - name: Setup Python for publisher tests
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify publication retry and immutability
        run: |
          python -m pip install -r scripts/publisher-requirements.txt
          python scripts/test_publish_downloads.py
          python scripts/test_release_workflow.py
          python scripts/test_release_platforms.py
          python scripts/test_publish_vision_resources.py
          python scripts/test_generate_area_name_aliases.py

      - name: TypeScript check
        run: npm exec tsc -- --noEmit
        shell: cmd

      - name: Build frontend
        run: npm run build
        shell: cmd

      - name: Check packaged guide resources
        run: npm run check:guide
        shell: cmd

      - name: Checkout bundled processor source
        uses: actions/checkout@v7
        with:
          repository: gjy991229/d2r-audio-mod
          ref: 7e1ed65d366837a096ad70eba22c29a0fd3fe41e
          path: .processor-source

      - name: Build bundled processor
        env:
          D2RHUB_PROCESSOR_REPO: ${{ github.workspace }}/.processor-source
        run: npm run build:processor
        shell: cmd

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
