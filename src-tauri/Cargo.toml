[package]
name = "d2rhub"
version = "0.9.119"
description = "Diablo II Resurrected Multi-Account Manager"
authors = ["D2RHub"]
edition = "2021"
license = "MIT"
repository = "https://github.com/gjy991229/D2RHub"
homepage = "https://github.com/gjy991229/D2RHub"
readme = "../README.md"

[lib]
name = "d2rhub_lib"
# Windows desktop links this Rust library into d2rhub.exe; no standalone DLL is needed.
crate-type = ["lib"]

[[bin]]
name = "d2rhub"
path = "src/main.rs"
test = false
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
sysinfo = "0.31"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["time", "macros", "process", "io-util"] }
windows = { version = "0.58", features = [
    "Foundation",
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Performance",
    "Win32_System_WinRT",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common"
] }
winreg = "0.52"
# 数据统计 SQLite
rusqlite = { version = "0.31", features = ["bundled"] }
open = "5"
hound = "3.5.1"
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "system-proxy"], default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
semver = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }

[target.'cfg(windows)'.dependencies]
wasapi = "0.24.0"
windows-capture = "2.0.1"
