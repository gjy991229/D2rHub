[package]
name = "d2rhub"
version = "0.8.0"
description = "Diablo II Resurrected Multi-Account Manager"
authors = ["D2RHub"]
edition = "2021"
license = "MIT"
repository = "https://github.com/gjy991229/D2RHub"
homepage = "https://github.com/gjy991229/D2RHub"
readme = "../README.md"

[lib]
name = "d2rhub_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "d2rhub"
path = "src/main.rs"
test = false
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["ocr"]
ocr = [
    "dep:windows-capture", "dep:xcap", "dep:image", "dep:imageproc",
    "dep:strsim", "dep:rusqlite", "dep:open", "dep:futures-util",
    "dep:kreuzberg-paddle-ocr", "dep:ort",
    "windows/Win32_Graphics_Dxgi", "windows/Win32_System_Com",
    "windows/Graphics_Imaging", "windows/Storage_Streams",
    "windows/Globalization"
]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
sysinfo = "0.31"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["time"] }
windows = { version = "0.58", features = ["Foundation", "Win32_Security_Cryptography"] }
winreg = "0.52"
# OCR 截图与图像处理
windows-capture = { version = "1.2", optional = true }
xcap = { version = "0.7", optional = true }
image = { version = "0.25", optional = true }
imageproc = { version = "0.27", optional = true }
strsim = { version = "0.11", optional = true }

# 数据统计 SQLite
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
open = { version = "5", optional = true }
reqwest = { version = "0.12", features = ["stream", "rustls-tls"], default-features = false }
futures-util = { version = "0.3", optional = true }
kreuzberg-paddle-ocr = { version = "5.0.0-rc.11", optional = true }
ort = { version = "=2.0.0-rc.12", features = ["download-binaries"], optional = true }

[target.'cfg(windows)'.dependencies]
ferrisetw = "1.2"
